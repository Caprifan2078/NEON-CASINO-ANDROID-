name: NEON 44 real game actions smoke QA
on:
  workflow_dispatch:
  push:
    branches: ['qa/performance-safety-20261104']
    paths: ['.ci/neon-gameplay-smoke-qa.py','.github/workflows/neon-gameplay-smoke-qa.yml']
permissions:
  contents: read
jobs:
  play-all:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact unchanged 44 game sources
        run: |
          set -euo pipefail
          mkdir -p s5platform
          unzip -q .ci/neon-s5-desktop-ios-sources.zip -d s5platform
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build tested native launcher
        run: |
          set -euo pipefail
          cd s5platform/BUILD_READY_WINDOWS_LAUNCHER
          go test ./...
          go vet ./...
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../dist/neon-linux main.go
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install headless real Chrome test dependencies
        run: |
          set -euo pipefail
          python3 -m pip install playwright psutil
          which google-chrome || which chromium
      - name: Attempt one gameplay round/start in each of 44 games
        run: |
          set -euo pipefail
          python3 .ci/neon-gameplay-smoke-qa.py s5platform/dist/neon-linux gameplay-evidence
      - name: Upload gameplay per-mode results and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEON-44-gameplay-action-smoke-results
          path: gameplay-evidence
          if-no-files-found: warn
