name: NEON P0 Apple Silicon cross-build fallback (Mac Intel host)
on:
  workflow_dispatch:
  push:
    branches: ['qa/bughunt-wallet-20261104']
    paths: ['.github/workflows/neon-p0-macos-arm-fallback.yml']
permissions:
  contents: read
jobs:
  apple-silicon-cross:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract frozen sources and apply tested owner-token P0 fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s5platform
          unzip -q .ci/neon-s5-desktop-ios-sources.zip -d s5platform
          python3 .ci/patch-p0-lease-cleanup.py s5platform
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test game resources and run actual Intel-native smoke against identical fixed source
        shell: bash
        run: |
          set -euo pipefail
          cd s5platform/BUILD_READY_WINDOWS_LAUNCHER
          go test ./...
          go vet ./...
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../dist/neon-macos-intel main.go
          cd ../..
          python3 s5platform/qa/verify_desktop_runtime.py s5platform/dist/neon-macos-intel
      - name: Cross-compile P0-fixed Apple Silicon Mach-O on Intel Mac and inspect architecture
        shell: bash
        run: |
          set -euo pipefail
          cd s5platform/BUILD_READY_WINDOWS_LAUNCHER
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o ../dist/neon-macos-arm64 main.go
          cd ../..
          file s5platform/dist/neon-macos-arm64 | tee s5platform/dist/ARM_ARCHITECTURE.txt
          lipo -archs s5platform/dist/neon-macos-arm64 | grep -Fx arm64
      - name: Construct app wrapper with explicit cross-build warning
        shell: bash
        run: |
          set -euo pipefail
          app='s5platform/dist/NEON CASINO ROYALE.app'
          mkdir -p "$app/Contents/MacOS"
          cp s5platform/dist/neon-macos-arm64 "$app/Contents/MacOS/NEONROYALE"
          chmod 755 "$app/Contents/MacOS/NEONROYALE"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>NEONROYALE</string>
          <key>CFBundleIdentifier</key><string>com.neon.royale.macos</string>
          <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          <key>CFBundleName</key><string>NEON CASINO ROYALE</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>1.8.9</string>
          <key>CFBundleVersion</key><string>190</string>
          <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict></plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          lipo -archs "$app/Contents/MacOS/NEONROYALE" | grep -Fx arm64
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          cat > s5platform/dist/QA_STATUS_RU.txt <<'TEXT'
          NEON CASINO ROYALE 1.8.9 P0 Apple Silicon cross-built QA.
          Built on Intel macOS with GOARCH=arm64. Intel-native smoke and all embedded asset checks PASS.
          Apple Silicon runtime test NOT YET PERFORMED. Ad-hoc signing ONLY (no Developer ID).
          Do not claim this as notarized release.
          TEXT
          cd s5platform/dist
          ditto -c -k --keepParent 'NEON CASINO ROYALE.app' NEON_Mac_Apple_Silicon_P0_CROSSBUILT_NOT_NATIVE_VERIFIED.zip
          unzip -t NEON_Mac_Apple_Silicon_P0_CROSSBUILT_NOT_NATIVE_VERIFIED.zip >/dev/null
          shasum -a 256 NEON_Mac_Apple_Silicon_P0_CROSSBUILT_NOT_NATIVE_VERIFIED.zip
      - name: Upload cross-build QA with explicit untested native execution warning
        uses: actions/upload-artifact@v4
        with:
          name: NEON-P0-AppleSilicon-CROSSBUILT-not-native-tested
          path: |
            s5platform/dist/NEON_Mac_Apple_Silicon_P0_CROSSBUILT_NOT_NATIVE_VERIFIED.zip
            s5platform/dist/QA_STATUS_RU.txt
            s5platform/dist/ARM_ARCHITECTURE.txt
          if-no-files-found: error
