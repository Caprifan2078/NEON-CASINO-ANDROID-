name: NEON P0 wallet and async transition bug-hunt
on:
  workflow_dispatch:
  push:
    branches: ['qa/bughunt-wallet-20261104']
    paths:
      - '.ci/neon-wallet-edge-qa.py'
      - '.github/workflows/neon-wallet-edge-qa.yml'
permissions:
  contents: read
jobs:
  p0-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract the existing audited game sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s5platform
          unzip -q .ci/neon-s5-desktop-ios-sources.zip -d s5platform
      - name: Apply fail-closed stale-lease cleanup fix to extracted source (not main)
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/patch-p0-lease-cleanup.py s5platform
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Compile and test native Go launcher
        shell: bash
        run: |
          set -euo pipefail
          cd s5platform/BUILD_READY_WINDOWS_LAUNCHER
          go test ./...
          go vet ./...
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../dist/neon-linux main.go
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser QA dependencies
        shell: bash
        run: |
          python3 -m pip install playwright psutil
          which google-chrome || which chromium
      - name: Test daily rollover, pending rounds, quota failures and four viewport sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/neon-wallet-edge-qa.py s5platform/dist/neon-linux wallet-evidence
      - name: Retain exact failure evidence and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEON-wallet-P0-cross-mode-edge-QA
          path: wallet-evidence/
          if-no-files-found: warn
