name: NEON P0 atomic import migration matrix v2-v5 QA
on:
  workflow_dispatch:
  push:
    branches: ['qa/p0-atomic-import-20261109']
    paths:
      - '.ci/neon-backup-migration-matrix.py'
      - '.ci/NEON_P0_IMPORT_ATOMIC_20261109.patch'
      - '.github/workflows/neon-backup-migration-matrix.yml'
permissions:
  contents: read
jobs:
  backup-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract audited v1.8.9 project; apply the previously verified P0 wallet fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s5platform
          unzip -q .ci/neon-s5-desktop-ios-sources.zip -d s5platform
          python3 .ci/patch-p0-lease-cleanup.py s5platform
          python3 .ci/patch-s5-reset-ephemeral.py s5platform
          d=s5platform/BUILD_READY_WINDOWS_LAUNCHER
          test "$(sha256sum "$d/web/app.js" | cut -d' ' -f1)" = "be6633c5c27017cdeab26dd750018becc29ae2de19d2a7583cc1e2f4224997fb"
          git apply --directory="$d" .ci/NEON_P0_ROULETTE_PRESETS_20261109.patch
          test "$(sha256sum "$d/web/app.js" | cut -d' ' -f1)" = "cbfeb97338224b36b439befdb1ea1f7401a7d131a398386b761cc95c245a56ba"
          git apply --directory="$d" .ci/NEON_P0_IMPORT_ATOMIC_20261109.patch
          test "$(sha256sum "$d/web/app.js" | cut -d' ' -f1)" = "1e6667698f1c7e4d0d9e894efcffe30c9e060e441e4977b4123236ebe5c499e2"
          node --check "$d/web/app.js"
          NEON_TEST_JS="$d/web/app.js" node .ci/neon-import-atomic-regression.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test and compile the existing native desktop launcher
        shell: bash
        run: |
          set -euo pipefail
          cd s5platform/BUILD_READY_WINDOWS_LAUNCHER
          go test ./...
          go vet ./...
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../dist/neon-linux main.go
      - name: Prepare real Chromium QA driver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright psutil
          which google-chrome || which chromium
      - name: Test v2 v3 v4 v5 migrations, undo and atomic failed-storage rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/neon-backup-migration-matrix.py s5platform/dist/neon-linux migration-evidence
      - name: Retain pass-or-fail evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEON-P0-ATOMIC-IMPORT-migration-matrix-evidence
          path: migration-evidence/
          if-no-files-found: warn
          retention-days: 30
