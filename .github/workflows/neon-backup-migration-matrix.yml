name: NEON P0 backup migration v2-v5 and quota rollback QA
on:
  workflow_dispatch:
  push:
    branches: ['qa/release-final-stress-20261104']
    paths:
      - '.ci/neon-backup-migration-matrix.py'
      - '.github/workflows/neon-backup-migration-matrix.yml'
permissions:
  contents: read
jobs:
  backup-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract audited v1.8.9 project; apply the previously verified P0 wallet fix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s5platform
          unzip -q .ci/neon-s5-desktop-ios-sources.zip -d s5platform
          python3 .ci/patch-p0-lease-cleanup.py s5platform
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test and compile the existing native desktop launcher
        shell: bash
        run: |
          set -euo pipefail
          cd s5platform/BUILD_READY_WINDOWS_LAUNCHER
          go test ./...
          go vet ./...
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../dist/neon-linux main.go
      - name: Prepare real Chromium QA driver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright psutil
          which google-chrome || which chromium
      - name: Test v2 v3 v4 v5 migrations, undo and atomic failed-storage rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/neon-backup-migration-matrix.py s5platform/dist/neon-linux migration-evidence
      - name: Retain pass-or-fail evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEON-P0-backup-migration-matrix-evidence
          path: migration-evidence/
          if-no-files-found: warn
          retention-days: 30
