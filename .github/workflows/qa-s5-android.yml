name: NEON S5 Android official build and emulator QA
on:
  workflow_dispatch:
  push:
    paths:
      - '.ci/neon-s5-android-sources.zip'
      - '.github/workflows/qa-s5-android.yml'
      - '.ci/run-s5-android-emulator.sh'
permissions:
  contents: read
jobs:
  android-apk:
    defaults:
      run:
        working-directory: s5src
    runs-on: ubuntu-latest
    env:
      NEON_CI_BUILD_ID: ${{ github.run_id }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact S5 source snapshot
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s5src
          unzip -q .ci/neon-s5-android-sources.zip -d s5src
          test -s s5src/app/build.gradle
          test -s s5src/web/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sources, all games and Android release gates
        run: |
          set -euo pipefail
          python3 tools/check_mobile.py
          python3 tools/check_project.py
          node --check web/app.js
          npm test
          npm run audit
          node tests/test_android_release_gates.cjs
          bash -n tests/android_smoke.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare optional stable QA signing key (not stored in repository)
        shell: bash
        env:
          NEON_QA_KEYSTORE_B64: ${{ secrets.NEON_QA_KEYSTORE_B64 }}
          HAS_STORE_PASSWORD: ${{ secrets.NEON_QA_STORE_PASSWORD }}
          HAS_KEY_ALIAS: ${{ secrets.NEON_QA_KEY_ALIAS }}
          HAS_KEY_PASSWORD: ${{ secrets.NEON_QA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$NEON_QA_KEYSTORE_B64" ]]; then
            if [[ -z "$HAS_STORE_PASSWORD" || -z "$HAS_KEY_ALIAS" || -z "$HAS_KEY_PASSWORD" ]]; then
              echo 'ERROR: signing secret set is incomplete.' >&2
              exit 1
            fi
            keystore="$RUNNER_TEMP/neon-qa-private.p12"
            ( umask 077; printf '%s' "$NEON_QA_KEYSTORE_B64" | base64 -d > "$keystore" )
            test -s "$keystore"
            echo "NEON_QA_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
            echo 'FRESH_INSTALL_ONLY=false' >> "$GITHUB_ENV"
            echo 'Stable signing key provided; update compatibility still requires matching the installed certificate.'
          else
            echo 'FRESH_INSTALL_ONLY=true' >> "$GITHUB_ENV"
            echo 'No stable signing key configured: this APK is for a fresh test installation only.'
          fi
      - name: Compile baseline and upgrade target with the SAME signer
        env:
          NEON_QA_STORE_PASSWORD: ${{ secrets.NEON_QA_STORE_PASSWORD }}
          NEON_QA_KEY_ALIAS: ${{ secrets.NEON_QA_KEY_ALIAS }}
          NEON_QA_KEY_PASSWORD: ${{ secrets.NEON_QA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Both builds use the same JS and package; only Android versionCode differs.
          # This is a real package-manager upgrade, NOT a historic code migration.
          gradle --no-daemon -PneonQaBaselineCode=189 :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/neon-qa-baseline.apk"
          gradle --no-daemon :app:assembleDebug
          test -s "$RUNNER_TEMP/neon-qa-baseline.apk"
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Check APK structure, package and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee /tmp/neon_apksigner.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/neon_apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep '^package:'
          unzip -l "$apk" | grep 'assets/web/app.js'
          sha256sum "$apk"
          if [[ "${FRESH_INSTALL_ONLY}" == 'true' ]]; then
            echo 'FRESH-INSTALL-ONLY: new package id for this run; do not expect to update an earlier APK.' > app/build/outputs/apk/debug/SIGNING_STATUS.txt
          else
            echo 'STABLE-KEY: compare certificate fingerprint with the installed application before updating.' > app/build/outputs/apk/debug/SIGNING_STATUS.txt
          fi
      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Emulator verify real versionCode upgrade and persisted wallet
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NEON_PREVIOUS_APK: ${{ runner.temp }}/neon-qa-baseline.apk
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 600
          script: bash .ci/run-s5-android-emulator.sh
      - name: Upload APK ONLY after successful emulator installation
        uses: actions/upload-artifact@v4
        with:
          name: NEON-v1.8.9-ANDROID-EMULATOR-TESTED
          path: |
            s5src/app/build/outputs/apk/debug/app-debug.apk
            s5src/app/build/outputs/apk/debug/SIGNING_STATUS.txt
          if-no-files-found: error
          retention-days: 30