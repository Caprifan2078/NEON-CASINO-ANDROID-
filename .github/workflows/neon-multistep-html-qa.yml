name: NEON P0 presets integration standalone HTML QA
on:
  workflow_dispatch:
  push:
    branches: ['qa/p0-roulette-presets-recovery-20261109']
    paths:
      - '.ci/build-standalone-offline.py'
      - '.github/workflows/neon-multistep-html-qa.yml'
      - '.ci/patch-p0-lease-cleanup.py'
      - '.ci/NEON_P0_ROULETTE_PRESETS_20261109.patch'
permissions:
  contents: read
jobs:
  offline-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract existing validated game assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s5src
          unzip -q .ci/neon-s5-android-sources.zip -d s5src
          test -s s5src/web/index.html
          test -s s5src/web/app.js
      - name: Apply verified stale-lease fix before generating standalone HTML
        run: |
          set -euo pipefail
          python3 .ci/patch-p0-lease-cleanup.py s5src
          python3 .ci/patch-s5-reset-ephemeral.py s5src
      - name: Apply exact reviewed roulette-presets diff without replacing P0 fixes
        shell: bash
        run: |
          set -euo pipefail
          echo "Source SHA: $(sha256sum s5src/web/app.js)"
          test "$(sha256sum s5src/web/app.js | cut -d' ' -f1)" = "be6633c5c27017cdeab26dd750018becc29ae2de19d2a7583cc1e2f4224997fb"
          test "$(sha256sum s5src/web/app.css | cut -d' ' -f1)" = "d01358f870169a38f00186439e0c4db01e3c8e1645fbbefb1d29ce56578eac67"
          patch --fuzz=0 --batch -d s5src -p1 < .ci/NEON_P0_ROULETTE_PRESETS_20261109.patch
          test "$(sha256sum s5src/web/app.js | cut -d' ' -f1)" = "cbfeb97338224b36b439befdb1ea1f7401a7d131a398386b761cc95c245a56ba"
          node --check s5src/web/app.js
          grep -Fq 'for(const key of Object.keys(rt))delete rt[key];' s5src/web/app.js
          grep -Fq 'JSON.parse(raw)?.token===INSTANCE_TOKEN' s5src/web/app.js
          echo "PASS: deterministic presets on exact 06-Nov P0 source"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build standalone HTML, no external dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/build-standalone-offline.py s5src/web site/NEON_CASINO_ROYALE_1.8.9_STANDALONE_OFFLINE.html
          test -s site/NEON_CASINO_ROYALE_1.8.9_STANDALONE_OFFLINE.html
      - name: Install browser test driver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install playwright
          which google-chrome || which chromium
      - name: Run all 44 games from a real offline file URL and reload persisted wallet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil,tempfile
          from playwright.sync_api import sync_playwright
          url=Path("site/NEON_CASINO_ROYALE_1.8.9_STANDALONE_OFFLINE.html").resolve().as_uri()
          chrome=shutil.which("google-chrome") or shutil.which("chromium")
          assert chrome
          with sync_playwright() as pw:
              context=pw.chromium.launch_persistent_context(user_data_dir=tempfile.mkdtemp(prefix="neon-offline-qa-"),executable_path=chrome,headless=True,args=["--no-sandbox"],viewport={"width":390,"height":844})
              try:
                  page=context.pages[0] if context.pages else context.new_page()
                  page.goto(url,wait_until="domcontentloaded",timeout=30000)
                  page.locator('#gameNav [data-action=nav]').first.wait_for(state='attached',timeout=20000)
                  assert page.locator('#gameNav [data-action=nav]').count()==44, 'Expected exactly 44 game navigation buttons'
                  page.on('dialog',lambda d:d.accept())
                  # Prove the new 26-game reset actually works in the file:// build too.
                  before=page.evaluate("""() => {
                    state.stake=10;navigate('letitride');letItRideStart();
                    return {active:rt.letitride?.active,reserved:state.reserved}
                  }""")
                  assert before=={'active':True,'reserved':30},before
                  page.evaluate("switchMode('daily')")
                  assert page.evaluate("rt.letitride == null && state.reserved===0 && state.mode==='daily' && profileSnapshots.free.balance===50000"), 'Stale Let It Ride after mode change'
                  page.evaluate("switchMode('free')")
                  assert page.evaluate("state.mode==='free' && state.balance===50000 && state.reserved===0")
                  print('PASS: file:// mode switch fully resets additional game state')
                  # Presets must never create partial reservations, change the wallet on save,
                  # or revive an active game after switching virtual wallets.
                  page.evaluate("navigate('roulette');state.chip=100;rouletteBet('number','17')")
                  assert page.evaluate("state.balance===49900 && state.reserved===100")
                  assert page.evaluate("roulettePresetSave(0)") is True
                  assert page.evaluate("roulettePresets[0]?.length===1")
                  page.evaluate("refund(100);rt.bets=[];render()")
                  assert page.evaluate("roulettePresetLoad(0)") is True
                  assert page.evaluate("state.balance===49900 && state.reserved===100 && rt.bets.length===1")
                  assert page.evaluate("snapshot().preferences.roulettePresets[0][0].amount") == 100
                  page.evaluate("refund(100);rt.bets=[];render()")
                  assert page.evaluate("state.balance===50000 && state.reserved===0")
                  print("PASS: P0 wallet + persisted v1.8.10 roulette preset, atomic spend")
                  initial=page.evaluate("String(state.balance)")
                  results=page.evaluate("""() => [...document.querySelectorAll('#gameNav [data-action=nav]')].map((n)=>{ const id=n.dataset.game; n.click(); return state.game===id && Boolean(document.querySelector('#gameArea')?.children.length);})""")
                  assert len(results)==44 and all(results), 'Not all 44 game panels rendered'
                  assert page.evaluate("String(state.balance)")==initial,'Navigation unexpectedly changed wallet'
                  page.evaluate("() => {save();localStorage.setItem('__neon_standalone_check','preserved')}")
                  page.reload(wait_until="domcontentloaded")
                  page.locator('#gameNav [data-action=nav]').first.wait_for(state='attached',timeout=20000)
                  assert page.locator('#gameNav [data-action=nav]').count()==44, 'Expected exactly 44 game navigation buttons'
                  assert page.evaluate("localStorage.getItem('__neon_standalone_check')")=="preserved", 'localStorage not persisted on reload'
                  assert page.evaluate("String(state.balance)")==initial,'Wallet changed on reload'
                  assert page.evaluate("roulettePresets[0]?.length===1"), 'Saved layout did not survive reload'
                  page.screenshot(path="site/NEON_OFFLINE_MOBILE_QA.png",full_page=True)
                  print("PASS: actual offline HTML loaded all 44 panels and preserved wallet on reload")
              finally:context.close()
          PY
      - name: Upload tested HTML and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEON-v1.8.9-P0-MULTISTEP-standalone-HTML-tested
          path: site/
          if-no-files-found: warn
