name: NEON P0 atomic import Windows and Linux native QA
on:
  workflow_dispatch:
  push:
    branches: ['qa/p0-atomic-import-20261109']
    paths:
      - '.github/workflows/neon-multistep-native-qa.yml'
      - '.ci/NEON_P0_ROULETTE_PRESETS_20261109.patch'
      - '.ci/NEON_P0_IMPORT_ATOMIC_20261109.patch'
      - '.ci/neon-import-atomic-regression.cjs'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows
            binary: neon-windows.exe
          - runner: ubuntu-latest
            target: linux
            binary: neon-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore original audited source without touching main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s5platform
          unzip -q .ci/neon-s5-desktop-ios-sources.zip -d s5platform
          test -s s5platform/BUILD_READY_WINDOWS_LAUNCHER/main.go
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify BOTH existing P0 wallet fixes in actual embedded assets
        shell: bash
        run: |
          set -euo pipefail
          python3 .ci/patch-p0-lease-cleanup.py s5platform
          python3 .ci/patch-s5-reset-ephemeral.py s5platform
          node .ci/neon-reset-runtime-test.cjs s5platform/BUILD_READY_WINDOWS_LAUNCHER/web/app.js
          node --check s5platform/BUILD_READY_WINDOWS_LAUNCHER/web/app.js
      - name: Apply checked roulette presets to native embedded game
        shell: bash
        run: |
          set -euo pipefail
          d=s5platform/BUILD_READY_WINDOWS_LAUNCHER
          # Python text I/O on Windows may rewrite modified JS as CRLF.
          # Restore portable LF before comparing exact known SHA and applying diff.
          python3 - <<'PY'
          from pathlib import Path
          folder=Path('s5platform/BUILD_READY_WINDOWS_LAUNCHER/web')
          for name in ('app.js','app.css'):
              path=folder/name
              path.write_bytes(path.read_bytes().replace(b'\r\n',b'\n'))
          PY
          test "$(sha256sum "$d/web/app.js" | cut -d' ' -f1)" = "be6633c5c27017cdeab26dd750018becc29ae2de19d2a7583cc1e2f4224997fb"
          test "$(sha256sum "$d/web/app.css" | cut -d' ' -f1)" = "d01358f870169a38f00186439e0c4db01e3c8e1645fbbefb1d29ce56578eac67"
          # Git for Windows checks out tracked .patch as CRLF under autocrlf.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.ci/NEON_P0_ROULETTE_PRESETS_20261109.patch')
          p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          PY
          git apply --directory="$d" .ci/NEON_P0_ROULETTE_PRESETS_20261109.patch
          # Git for Windows may create CRLF files after the successful apply.
          python3 - <<'PY'
          from pathlib import Path
          folder=Path('s5platform/BUILD_READY_WINDOWS_LAUNCHER/web')
          for name in ('app.js','app.css'):
              path=folder/name
              path.write_bytes(path.read_bytes().replace(b'\r\n',b'\n'))
          PY
          sha256sum "$d/web/app.js" "$d/web/app.css"
          test "$(sha256sum "$d/web/app.js" | cut -d' ' -f1)" = "cbfeb97338224b36b439befdb1ea1f7401a7d131a398386b761cc95c245a56ba"
          node --check "$d/web/app.js"
      - name: Verify atomic import patch on native game and test storage failures
        shell: bash
        run: |
          set -euo pipefail
          d=s5platform/BUILD_READY_WINDOWS_LAUNCHER
          test "$(sha256sum "$d/web/app.js" | cut -d' ' -f1)" = "cbfeb97338224b36b439befdb1ea1f7401a7d131a398386b761cc95c245a56ba"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.ci/NEON_P0_IMPORT_ATOMIC_20261109.patch')
          p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          PY
          git apply --directory="$d" .ci/NEON_P0_IMPORT_ATOMIC_20261109.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('s5platform/BUILD_READY_WINDOWS_LAUNCHER/web/app.js')
          p.write_bytes(p.read_bytes().replace(b'\r\n',b'\n'))
          PY
          test "$(sha256sum "$d/web/app.js" | cut -d' ' -f1)" = "1e6667698f1c7e4d0d9e894efcffe30c9e060e441e4977b4123236ebe5c499e2"
          node --check "$d/web/app.js"
          NEON_TEST_JS="$d/web/app.js" node .ci/neon-import-atomic-regression.cjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test Go launcher with embedded updated game resources
        shell: bash
        working-directory: s5platform/BUILD_READY_WINDOWS_LAUNCHER
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...
      - name: Build executable for actual host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s5platform/dist
          cd s5platform/BUILD_READY_WINDOWS_LAUNCHER
          CGO_ENABLED=0 GOOS=${{ matrix.target }} GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o '../dist/${{ matrix.binary }}' main.go
      - name: Smoke launch, test localhost host protection and bundled assets
        shell: bash
        run: |
          set -euo pipefail
          python3 s5platform/qa/verify_desktop_runtime.py s5platform/dist/${{ matrix.binary }}
      - name: Upload host-tested QA-only executable
        uses: actions/upload-artifact@v4
        with:
          name: NEON-P0-ATOMIC-IMPORT-${{ matrix.target }}-x64-QA
          path: s5platform/dist/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30
