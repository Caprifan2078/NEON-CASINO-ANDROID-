plugins { id 'com.android.application' }
android {
    namespace 'com.neon.play.simulator'
    compileSdk 35
    defaultConfig {
        applicationId 'com.neon.play.simulator'
        minSdk 24
        targetSdk 34
        versionCode 175
        versionName '1.7.5'
    }
    buildTypes {
        release { minifyEnabled false }
        debug {
            minifyEnabled false
            applicationIdSuffix '.qa175'
            versionNameSuffix '-qa'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
